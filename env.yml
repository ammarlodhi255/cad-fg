name: metaimg-cadica
channels: [pytorch, nvidia, conda-forge, defaults]
dependencies:
  - python=3.10
  - pytorch>=2.2
  - torchvision>=0.17
  - cudatoolkit=11.8        # if you have NVIDIA CUDA; otherwise remove
  - pip
  - pip:
      - timm>=1.0.8
      - pandas>=2.2
      - numpy>=1.26
      - scikit-learn>=1.5
      - opencv-python>=4.9
      - albumentations>=1.4
      - matplotlib>=3.8
      - pyyaml>=6.0
      - tqdm>=4.66
      - pillow>=10.3
      - openpyxl>=3.1
      - captum>=0.7
      - pandas>=2.3.2
      - sentence-transformers>=3.3.0