seed: 1337
img_size: 224
num_frames: 10
batch_size: 16
epochs: 100
lr: 0.0001
weight_decay: 0.0001
optimizer: rmsprop # (or adamw, adam, sgd)
early_stopping_patience: 20
temporal_layers: 2
temporal_heads: 8
temporal_pool: cls  # 'cls' or 'mean'

# Metadata usage and variant selection
use_metadata: true
metadata_path: data/CADICA/metadata.xlsx
metadata_features:
  numeric: [age, height, weight, bmi, evol_dm_years, lvef_pct, n_vessels, max_involvement_pct]
  categorical: [sex, diabetes, dyslipidemia, smoker, hypertension, kidney_failure, heart_failure, atrial_fib]
  text:
    - another_comorb
    - indication
    - later_events
# These mirror keys in configs/default.yaml
text_encoder: "sentence-transformers/all-MiniLM-L6-v2"
text_cache_dir: "outputs/text_embeds"
# Pick one: plain | meta_token | film | prompt | cls_cross
vit_temporal_variant: meta_token
pat_channels: 4
prompt_tokens: 4
cls_cross_heads: 8
